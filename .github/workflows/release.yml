name: TGMonet Radical Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build TGMonet Radical Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Keystore
        run: |
          mkdir -p ~/.gradle
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using fixed release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          elif [ -f "app/tgmonet_radical.keystore" ]; then
            echo "Using bundled permanent release keystore..."
            cp app/tgmonet_radical.keystore app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=tgmonet_radical" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./TGMonet-Radical-v14.4.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGMonet-Radical-v14.4.0.apk
          path: TGMonet-Radical-v14.4.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v14.4.0-radical
          name: TGMonet Radical v14.4.0
          body: |
            ## TGMonet Radical v14.4.0

            ### 🌊 What's New:
            - **官方 Material 3 Expressive 形状库 (海胆、四叶草、太阳花)**:
              - 遵循 [M3 Expressive 官方规范](https://m3.material.io/blog/building-with-m3-expressive)，引入官方海胆 (Sea Urchin / Soft Burst)、四叶草/八叶草 (Clover)、阳光太阳 (Sunny / Sunburst) 等高阶几何元素！
              - 新增预设 **M3 表现力 (M3 Expressive)**，支持全自动参数化高阶多布局轮转。
            - **修复壁纸打包进主题不生效的 Bug (WPS Stream Protocol Fix)**:
              - 经过逆向 Telegram Android 核心源码（`Theme.java:7580-7620`），修复了此前 `WLS=` 抢占覆盖和 offset 格式不匹配的问题。
              - 现已严格采用 Telegram 原生 `WPS`（Wallpaper Stream）二进制流协议，将高分辨率壁纸直接无缝打入 `.attheme` 文件尾部，导入主题瞬间自动加载壁纸！
            - **官方标准构图与大幅度多布局换构图**:
              - 严格依照 Google Pixel 官方壁纸规范，清除凌乱小散点，保留大面积纯净呼吸留白。
              - 「换个构图」支持 4 种真大多样性大布局变换与色阶交替。
            - **更新全量 README.md 文档**:
              - 全面重写项目 README.md，包含核心特色、形状库图表、构建指南与安装指引。

            ### 📦 Installation
            Download and install `TGMonet-Radical-v14.4.0.apk` below. Directly overwrites previous builds with no need to uninstall!
          files: TGMonet-Radical-v14.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
