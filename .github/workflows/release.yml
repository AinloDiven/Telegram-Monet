name: TGMonet Radical Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build TGMonet Radical Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Keystore
        run: |
          mkdir -p ~/.gradle
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using fixed release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          elif [ -f "app/tgmonet_radical.keystore" ]; then
            echo "Using bundled permanent release keystore..."
            cp app/tgmonet_radical.keystore app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=tgmonet_radical" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./TGMonet-Radical-v14.3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGMonet-Radical-v14.3.0.apk
          path: TGMonet-Radical-v14.3.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v14.3.0-radical
          name: TGMonet Radical v14.3.0
          body: |
            ## TGMonet Radical v14.3.0

            ### 🎯 What's New:
            - **Pixel 官方标准构图与大幅度多布局换构图 (Genuine Multi-Layout Composition Engine)**:
              - 完全参考 Google Pixel 官方壁纸规范重构构图秩序，彻底消除无规律乱象与突兀小散点，保留大面积纯净呼吸留白。
              - 「🎲 换个构图」升级为真大多样性布局生成：对角镜像、边轴翻转、焦点置顶/置底、主次色阶交替，每一次点击都呈现截然不同、秩序分明的官方级标准壁纸。
              - 完美复刻三大官方经典：
                1. *Floating Geometry (悬浮极简)*：纯正 45° 圆角方块 (Squircle) 阵列 + 对侧有机软云 (Amoeba) 留白平衡。
                2. *Pixel Bloom (贝壳花朵)*：Pixel 标志性 12 瓣贝壳花朵徽章 (Scalloped Cog Badge) + 优雅拱顶 + 边缘纵向波浪。
                3. *Silk Dunes (丝滑沙丘)*：流动多层叠级沙丘贝塞尔带，柔和多层丝滑穿插。
                4. *Pixel Classic / Fluid Waves / Bauhaus Modern*：同步升级多布局构图支持。
            - **聊天气泡半透明透光 (Translucent Chat Bubbles)**:
              - 规范术语为「半透明聊天气泡」，80%~85% 优雅透光度，消除脏黑阴影，与底层壁纸自然辉映。

            ### 📦 Installation
            Download and install `TGMonet-Radical-v14.3.0.apk` below. Directly overwrites previous builds seamlessly!
          files: TGMonet-Radical-v14.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
