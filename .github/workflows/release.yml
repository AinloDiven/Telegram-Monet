name: TGMonet Radical Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build TGMonet Radical Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Keystore
        run: |
          mkdir -p ~/.gradle
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using fixed release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          elif [ -f "app/tgmonet_radical.keystore" ]; then
            echo "Using bundled permanent release keystore..."
            cp app/tgmonet_radical.keystore app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=tgmonet_radical" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./TGMonet-Radical-v14.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGMonet-Radical-v14.1.0.apk
          path: TGMonet-Radical-v14.1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v14.1.0-radical
          name: TGMonet Radical v14.1.0
          body: |
            ## TGMonet Radical v14.1.0

            ### 🎨 What's New: Pixel Geometric Wallpaper Generator
            - **Pixel Motif Wallpaper Engine**: Autonomously generates harmonized Material 3 Expressive geometric wallpapers based on Google Pixel design language.
            - **3 Composition Presets**:
              1. *Pixel Classic*: The iconic cubic bezier organic wave, central sphere, high-chroma punchy accent dot, and tilted rounded rectangle.
              2. *Fluid Waves*: Layered organic fluid waves with accent pill and circle.
              3. *Bauhaus Modern*: Clean architectural geometric shapes.
            - **Dynamic Monet Adaptation**: Live synchronized with current wallpaper extraction or custom palette in both Light Mode and Dark/AMOLED Mode.
            - **Save or Attach**: One-tap export of 1080×2400 high-res PNG to device storage, or automatic embedding directly into Telegram `.attheme` themes (`wallpaperFileOffset`).

            ### 📦 Installation
            Download and install `TGMonet-Radical-v14.1.0.apk` below.
          files: TGMonet-Radical-v14.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
