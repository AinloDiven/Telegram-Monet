name: TGMonet Radical Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build TGMonet Radical Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Keystore
        run: |
          mkdir -p ~/.gradle
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using fixed release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          elif [ -f "app/tgmonet_radical.keystore" ]; then
            echo "Using bundled permanent release keystore..."
            cp app/tgmonet_radical.keystore app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=tgmonet_radical" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./TGMonet-Radical-v14.5.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGMonet-Radical-v14.5.0.apk
          path: TGMonet-Radical-v14.5.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v14.5.0-radical
          name: TGMonet Radical v14.5.0
          body: |
            ## TGMonet Radical v14.5.0

            ### 🎨 What's New:
            - **1:1 复刻 Google Pixel 官方 Motif 壁纸样式 & M3 Expressive C² 贝塞尔几何引擎重构**:
              - 彻底重写 `PixelWallpaperGenerator.kt`，淘汰粗糙的极坐标余弦折线，改用 **C² 连续切向三次贝塞尔插值 (`drawRoundedStarPolygon`)** 与精确的多段贝塞尔流线。
              - **1:1 像素级复刻 Pixel 四大官方样图**（`经典几何`、`悬浮极简`、`贝壳花朵`、`丝滑沙丘`），还原 4 瓣云朵饼干 (`Cookie4Sided`)、9 瓣柔波花朵 (`Cookie9Sided`)、双凸波浪以及双 S 型层叠沙丘与嵌套浅紫飘带。
              - **重构 `M3 表现力 (M3 Expressive)` 预设**：采用官方巨幅边缘出血裁剪 + 中央呼吸留白通道设计，包含 16 芒海胆 (`SoftBurst`)、饱满四叶草 (`Clover4Leaf`)、八叶花朵 (`Clover8Leaf`)、阳光太阳 (`Sunny`) 与倾斜胶囊。
            - **「🎲 换个构图」100% 确定性宏观轮转**:
              - 采用互质步进算法 `(seed + 5) % 12`，确保每一次点击都 100% 切换到全新的象限宏观构图与色阶组合，绝不原地重复。

            ### 📦 Installation
            Download and install `TGMonet-Radical-v14.5.0.apk` below. Directly overwrites previous builds with no need to uninstall!
          files: TGMonet-Radical-v14.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
