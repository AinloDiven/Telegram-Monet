name: TGMonet Radical Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build TGMonet Radical Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Keystore
        run: |
          mkdir -p ~/.gradle
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using fixed release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
          elif [ -f "app/tgmonet_radical.keystore" ]; then
            echo "Using bundled permanent release keystore..."
            cp app/tgmonet_radical.keystore app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> ~/.gradle/gradle.properties
            echo "RELEASE_STORE_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_ALIAS=tgmonet_radical" >> ~/.gradle/gradle.properties
            echo "RELEASE_KEY_PASSWORD=tgmonet_radical_2026" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./TGMonet-Radical-v14.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGMonet-Radical-v14.2.0.apk
          path: TGMonet-Radical-v14.2.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v14.2.0-radical
          name: TGMonet Radical v14.2.0
          body: |
            ## TGMonet Radical v14.2.0

            ### ✨ What's New:
            - **Frosted Glass Chat Bubbles (磨砂透明聊天气泡)**:
              - Messages (`chat_inBubble` & `chat_outBubble`) now feature a translucent frosted glass aesthetic (80%~85% opacity).
              - When combined with Telegram's blurred wallpaper (`WLS=tg://wallpaper?mode=blur`), the bubbles achieve an authentic glassmorphism frosted glass effect.
              - Eliminates harsh opaque shadows (`chat_inBubbleShadow=0`, `chat_outBubbleShadow=0`) for a seamless, floating crystal appearance.
              - Dedicated setting toggle in SettingsCard: toggle on/off anytime.
            - **Refined & Compact Geometric Scale (缩小几何图形比例)**:
              - Scaled down shapes across all styles by 25%~35% to provide generous negative space (留白) and high aesthetic balance without cluttering the chat view.
            - **New Official Google Pixel Wallpaper Styles (扩展官方 Pixel 壁纸样式)**:
              1. *Pixel Bloom (贝壳花朵)*: Signature 12-lobed Pixel Scalloped Flower Badge, flowing organic vertical contour, and top arch.
              2. *Floating Geometry (悬浮极简)*: Rotated rounded diamond squircles, soft organic amoeba cloud, and accent pebbles with generous breathing room.
              3. *Silk Dunes (丝滑沙丘)*: Multi-tone sweeping diagonal strata ribbons with smooth organic curves and warm corner accents.
              4. *Pixel Classic (经典几何微缩版)*: Refined, compact version of the original Pixel composition.
              5. *Fluid Waves (流体波浪)*: Smooth wave layers and floating accent pills.
              6. *Bauhaus Modern (包豪斯现代)*: Slender, architectural geometric forms.

            ### 📦 Installation
            Download and install `TGMonet-Radical-v14.2.0.apk` below. Directly overwrites previous `v14.1.0-radical` builds with no need to uninstall!
          files: TGMonet-Radical-v14.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
